version: 2

models:
  - name: trnx_test
    description: "Customer amount should not be null"

    columns:
      - name: amount
        tests:
          - not_null

      
      - name: transaction_type
        description: "Transaction type must be one of the allowed values"
        tests:
          - accepted_values:
              arguments:
                values: 
                  - "Refund"
                  - "Transfer"
                  - "Purchase"
  
  
  - name: tran_date_less_then_currentdate
    description: "Transaction date should be less than current_date"

    columns:
    - name: TRANSACTION_DATE
      tests:
        - trans_date_less_than_current_date